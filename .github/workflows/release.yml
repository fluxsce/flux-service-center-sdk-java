# 发布到 Maven Central。仓库 Settings → Secrets and variables → Actions 需配置：
#   CENTRAL_USERNAME     Sonatype Central 用户 Token 用户名
#   CENTRAL_PASSWORD     Sonatype Central 用户 Token 密码
#   GPG_PRIVATE_KEY      ASCII-armored GPG 私钥
#   GPG_PASSPHRASE       GPG 私钥口令
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Maven Central
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${TAG_VERSION}" != "${POM_VERSION}" ]]; then
            echo "Tag version ${TAG_VERSION} does not match pom.xml version ${POM_VERSION}" >&2
            exit 1
          fi

      - name: Build and test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true'
        run: mvn -B -ntp verify

      - name: Publish to Maven Central
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp deploy -Dgpg.skip=false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux-service-center-sdk
          path: |
            target/flux-service-center-sdk-*.jar
            target/flux-service-center-sdk-*.pom
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/flux-service-center-sdk-*.jar
