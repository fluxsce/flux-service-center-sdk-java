name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux-service-center-sdk
          path: |
            target/flux-service-center-sdk-*.jar
            target/flux-service-center-sdk-*.pom
          if-no-files-found: error
          retention-days: 7
